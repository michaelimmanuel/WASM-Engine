<!DOCTYPE html>
<html>
<head>
    <title>WASM Physics Engine - Collision Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        canvas {
            border: 2px solid #333;
            background: #ffffff;
            display: block;
            margin: 20px 0;
        }
        .controls {
            margin: 20px 0;
            padding: 15px;
            background: #fff;
            border-radius: 5px;
        }
        button {
            padding: 8px 16px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }
        button:hover {
            background: #0056b3;
        }
        .info {
            padding: 15px;
            background: #fff;
            border-radius: 5px;
            margin: 10px 0;
        }
        .collision-status {
            font-weight: bold;
            color: #d9534f;
        }
        .no-collision {
            color: #5cb85c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Physics Engine - Collision Detection Test</h1>
        
        <canvas id="canvas" width="800" height="600"></canvas>
        
        <div class="info">
            <p><strong>How to use:</strong> Drag circles to move them around. Green outline appears when two circles collide.</p>
            <p><strong>Controls:</strong> Click and drag any circle. Yellow = currently dragged.</p>
        </div>
        
        <div class="controls">
            <button id="resetBtn">Reset Simulation</button>
            <button id="pauseBtn">Pause</button>
            <button id="createBtn">Create Body at (400, 20)</button>
        </div>
        
        <div class="info">
            <p>Bodies Count: <strong id="bodyCount">0</strong></p>
            <p>Collision Status: <span id="collisionStatus" class="no-collision">No collisions</span></p>
            <p>Collision Details: <span id="collisionDetails">-</span></p>
            <p>FPS: <strong id="fps">60</strong></p>
        </div>
    </div>
    
    <script type="module">
        import init, { World } from "../pkg/wasm_engine.js";

        async function run() {
            await init();

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const bodyCountEl = document.getElementById('bodyCount');
            const collisionStatusEl = document.getElementById('collisionStatus');
            const collisionDetailsEl = document.getElementById('collisionDetails');
            const fpsEl = document.getElementById('fps');
            const resetBtn = document.getElementById('resetBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const createBtn = document.getElementById('createBtn');

            let world = new World();
            let isRunning = false; // Start paused so user can position bodies
            let frameCount = 0;
            let lastTime = performance.now();
            const CIRCLE_RADIUS = 20;
            const THROW_DAMPING = 0.3; // Reduce throw velocity (0.0 - 1.0)
            
            // Track dragging
            let draggedBodyId = null;
            let bodyPositions = {}; // Store positions for manual control
            let dragStartPosition = null; // Track drag start for velocity
            let dragPositionHistory = []; // Track recent positions for velocity

            // Initialize with two bodies
            world.create_body(1.0, 100, 50);   // Body 0: left side
            world.create_body(1.0, 700, 50);   // Body 1: right side
            bodyPositions[0] = { x: 100, y: 50 };
            bodyPositions[1] = { x: 700, y: 50 };

            resetBtn.addEventListener('click', () => {
                world = new World();
                world.create_body(1.0, 100, 50);
                world.create_body(1.0, 700, 50);
                bodyPositions = { 0: { x: 100, y: 50 }, 1: { x: 700, y: 50 } };
                draggedBodyId = null;
                isRunning = false;
                pauseBtn.textContent = 'Pause';
            });

            pauseBtn.addEventListener('click', () => {
                isRunning = !isRunning;
                pauseBtn.textContent = isRunning ? 'Pause' : 'Resume';
                // Toggle gravity for all bodies when running
                const count = world.bodies_count();
                for (let i = 0; i < count; i++) {
                    world.set_body_gravity(i, isRunning);
                }
            });

            createBtn.addEventListener('click', () => {
                world.create_body(1.0, 400, 20);
            });

            // Mouse events for dragging bodies
            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const bodyCount = world.bodies_count();

                // Check if mouse is over any circle
                for (let i = 0; i < bodyCount; i++) {
                    const x = bodyPositions[i]?.x || world.get_body_position_x(i);
                    const y = bodyPositions[i]?.y || world.get_body_position_y(i);
                    const dx = mouseX - x;
                    const dy = mouseY - y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist <= CIRCLE_RADIUS) {
                        draggedBodyId = i;
                        dragStartPosition = { x: x, y: y, time: performance.now() };
                        dragPositionHistory = [{ x: x, y: y, time: performance.now() }];
                        // Stop the body from moving while dragging
                        world.set_body_velocity(i, 0, 0);
                        break;
                    }
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                if (draggedBodyId !== null) {
                    const rect = canvas.getBoundingClientRect();
                    const mouseX = Math.max(CIRCLE_RADIUS, Math.min(canvas.width - CIRCLE_RADIUS, e.clientX - rect.left));
                    const mouseY = Math.max(CIRCLE_RADIUS, Math.min(canvas.height - CIRCLE_RADIUS, e.clientY - rect.top));
                    
                    // Track position history for velocity calculation
                    const now = performance.now();
                    dragPositionHistory.push({ x: mouseX, y: mouseY, time: now });
                    
                    // Keep only last 100ms of history
                    dragPositionHistory = dragPositionHistory.filter(pos => now - pos.time < 100);
                    
                    bodyPositions[draggedBodyId] = { x: mouseX, y: mouseY };
                    // Update the position in the Rust world too
                    world.set_body_position(draggedBodyId, mouseX, mouseY);
                }
            });

            canvas.addEventListener('mouseup', () => {
                if (draggedBodyId !== null && dragPositionHistory.length > 1) {
                    // Calculate velocity from position history
                    const currentPos = dragPositionHistory[dragPositionHistory.length - 1];
                    const oldPos = dragPositionHistory[0];
                    const dt = Math.max(0.016, (currentPos.time - oldPos.time) / 1000);
                    const vx = (currentPos.x - oldPos.x) / dt * THROW_DAMPING;
                    const vy = (currentPos.y - oldPos.y) / dt * THROW_DAMPING;
                    console.log(`Release: velocity = (${vx.toFixed(2)}, ${vy.toFixed(2)}), dt=${dt.toFixed(3)}, distance=${Math.sqrt(vx*vx + vy*vy).toFixed(2)}`);
                    world.set_body_velocity(draggedBodyId, vx, vy);
                    // Clear the manual position so the body uses Rust physics
                    delete bodyPositions[draggedBodyId];
                }
                draggedBodyId = null;
                dragPositionHistory = [];
            });

            canvas.addEventListener('mouseleave', () => {
                if (draggedBodyId !== null && dragPositionHistory.length > 1) {
                    // Calculate velocity from position history
                    const currentPos = dragPositionHistory[dragPositionHistory.length - 1];
                    const oldPos = dragPositionHistory[0];
                    const dt = Math.max(0.016, (currentPos.time - oldPos.time) / 1000);
                    const vx = (currentPos.x - oldPos.x) / dt * THROW_DAMPING;
                    const vy = (currentPos.y - oldPos.y) / dt * THROW_DAMPING;
                    world.set_body_velocity(draggedBodyId, vx, vy);
                    // Clear the manual position so the body uses Rust physics
                    delete bodyPositions[draggedBodyId];
                }
                draggedBodyId = null;
                dragPositionHistory = [];
            });

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Always run physics step (includes integration and collision resolution)
                world.step(1 / 60);

                const bodyCount = world.bodies_count();
                bodyCountEl.textContent = bodyCount;

                // Draw bodies
                let hasCollision = false;
                let collisionInfo = [];
                
                for (let i = 0; i < bodyCount; i++) {
                    // Use manually set position if available, otherwise use world position
                    let x = bodyPositions[i]?.x || world.get_body_position_x(i);
                    let y = bodyPositions[i]?.y || world.get_body_position_y(i);
                    
                    let isColliding = false;

                    // Check collisions with other bodies using WASM collision detection
                    for (let j = i + 1; j < bodyCount; j++) {
                        if (world.collides(i, j)) {
                            isColliding = true;
                            hasCollision = true;
                            
                            // Get collision details from Rust
                            const penetration = world.get_collision_penetration(i, j);
                            const normalX = world.get_collision_normal_x(i, j);
                            const normalY = world.get_collision_normal_y(i, j);
                            
                            collisionInfo.push(`B${i}-B${j}: pen=${penetration.toFixed(2)}, n=(${normalX.toFixed(2)}, ${normalY.toFixed(2)})`);
                            
                            // Draw collision normal vector
                            const otherX = bodyPositions[j]?.x || world.get_body_position_x(j);
                            const otherY = bodyPositions[j]?.y || world.get_body_position_y(j);
                            const midX = (x + otherX) / 2;
                            const midY = (y + otherY) / 2;
                            
                            ctx.strokeStyle = '#ff6b6b';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.moveTo(midX, midY);
                            ctx.lineTo(midX + normalX * 30, midY + normalY * 30);
                            ctx.stroke();
                            
                            // Draw arrow head
                            const angle = Math.atan2(normalY, normalX);
                            ctx.beginPath();
                            ctx.moveTo(midX + normalX * 30, midY + normalY * 30);
                            ctx.lineTo(
                                midX + normalX * 30 - 8 * Math.cos(angle - Math.PI / 6),
                                midY + normalY * 30 - 8 * Math.sin(angle - Math.PI / 6)
                            );
                            ctx.moveTo(midX + normalX * 30, midY + normalY * 30);
                            ctx.lineTo(
                                midX + normalX * 30 - 8 * Math.cos(angle + Math.PI / 6),
                                midY + normalY * 30 - 8 * Math.sin(angle + Math.PI / 6)
                            );
                            ctx.stroke();
                        }
                    }

                    // Draw circle
                    ctx.beginPath();
                    ctx.arc(x, y, CIRCLE_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = draggedBodyId === i ? '#ffd700' : '#ff6b6b';
                    ctx.fill();

                    // Draw outline - green if colliding
                    ctx.strokeStyle = isColliding ? '#51cf66' : '#333';
                    ctx.lineWidth = isColliding ? 3 : 2;
                    ctx.stroke();

                    // Draw label
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`B${i}`, x, y + 4);
                }

                // Update collision status
                if (hasCollision) {
                    collisionStatusEl.textContent = 'Collision Detected!';
                    collisionStatusEl.className = 'collision-status';
                    collisionDetailsEl.textContent = collisionInfo.join(' | ');
                } else {
                    collisionStatusEl.textContent = 'No collisions';
                    collisionStatusEl.className = 'no-collision';
                    collisionDetailsEl.textContent = '-';
                }

                // Update FPS
                frameCount++;
                const now = performance.now();
                if (now - lastTime >= 1000) {
                    fpsEl.textContent = frameCount;
                    frameCount = 0;
                    lastTime = now;
                }

                requestAnimationFrame(draw);
            }

            draw();
        }
        run();
    </script>

</body>
</html>
